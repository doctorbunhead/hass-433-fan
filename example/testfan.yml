script:
  - id: send_rf_code
    parameters:
      code_binary: string
    then:
      - remote_transmitter.transmit_rc_switch_raw:
          code: !lambda 'return code_binary;'
          protocol:
            pulse_length: 432
            sync: [277, 1124]
            zero: [0, 5068]
            one: [1144, 5068]
          repeat:
            times: 7

button:
  - platform: template
    name: "testremote_Fan Speed 1"
    on_press:
      - script.execute:
          id: send_rf_code
          code_binary: "010010110011001010000111111101100"  # b4cd78098
